[project]
name = "cellab"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyside6-essentials>=6.8",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "scipy>=1.13",
]

[project.scripts]
cellab = "cellab:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E702", "E731"]
