name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: xcb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt/VTK under Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libxcb-randr0 libxcb-xfixes0 libxcb-sync1 \
            libxcb-xkb1 libxcb-glx0 libxrender1 libxi6 libsm6 libice6 libdbus-1-3 libfontconfig1 libfreetype6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1200x24" uv run pytest -q 2>&1 | tee pytest.log
      - name: Linux bundle and self-test
        shell: bash
        run: |
          set -o pipefail
          ./packaging/build_linux.sh 2>&1 | tee build.log
      - name: Report failure details
        if: failure()
        run: |
          for f in pytest.log build.log; do [ -f "$f" ] && python3 .github/scripts/annotate_log.py "$f" "$f"; done; true
      - uses: actions/upload-artifact@v4
        with:
          name: CellLab-linux
          path: build/CellLab-*-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Software OpenGL (Mesa) for the headless runner
        uses: pyvista/setup-headless-display-action@v3
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Dependencies
        run: uv sync --frozen
      - name: Tests
        shell: pwsh
        run: |
          uv run pytest -q *>&1 | Tee-Object -FilePath pytest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, self-test and package
        shell: pwsh
        run: |
          try { ./packaging/build_windows.ps1 -SkipTests *>&1 | Tee-Object -FilePath build.log }
          catch { ($_ | Out-String) | Add-Content build.log; throw }
      - name: Report failure details
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in "pytest.log", "build.log", "build\self_test.json") {
            if (Test-Path $f) { uv run python .github/scripts/annotate_log.py $f $f }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CellLab-windows
          path: |
            build/CellLab-*-win64-portable.zip
            build/CellLab-*-win64-setup.exe
